# 拾墨 Shimo — 自动发布
# 触发：推送 v* 标签（如 v0.1.0）后自动：
#   1. Windows：构建前端 + PyInstaller 便携版 exe → 打包 zip → 上传 GitHub Release
#   2. Docker：多架构（amd64/arm64）构建 → 推送 GHCR（ghcr.io/<owner>/<repo>/shimo）
# 发版流程：git tag v0.1.0 && git push origin v0.1.0

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  windows-exe:
    name: Windows 便携版 exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 后端测试
        run: python -m pytest tests/ -q

      - name: 构建发行包（前端 + PyInstaller + zip）
        shell: pwsh
        run: ./scripts/build_win.ps1 -Version ${{ github.ref_name }}

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Shimo-${{ github.ref_name }}-win64.zip
          generate_release_notes: true

  docker:
    name: Docker 镜像（GHCR）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像名（GHCR 要求小写）
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/shimo" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
