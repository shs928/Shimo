<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ebecf0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2e3236" media="(prefers-color-scheme: dark)" />
    <script>
      // 主题预置：在应用挂载前写入 data-theme，避免首帧闪旧色
      (function () {
        try {
          var m = localStorage.getItem('shimo:theme')
          if (m !== 'daylight' && m !== 'midnight')
            m = matchMedia('(prefers-color-scheme: dark)').matches ? 'midnight' : 'daylight'
          document.documentElement.dataset.theme = m
        } catch (e) {
          document.documentElement.dataset.theme = 'daylight'
        }
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>拾墨 · Shimo</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // PWA：仅生产环境注册（开发模式由 Vite 提供服务）
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
